services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: zensible
      POSTGRES_USER: zensible
      POSTGRES_PASSWORD: zensible_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zensible -d zensible"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
