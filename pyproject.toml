[project]
name = "zensible"
version = "0.1.0"
description = "Production-minded multi-agent HR onboarding system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.14.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: calls a configured live model or service",
    "assignment: exercises the PDF scenario",
    "postgres: requires the local PostgreSQL service",
]
