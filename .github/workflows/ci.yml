name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: zensible
          POSTGRES_USER: zensible
          POSTGRES_PASSWORD: zensible_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zensible -d zensible"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run pytest --postgres tests/integration/test_postgres_checkpointer.py -q
